name: Executar Testes Cypress (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Executar Testes Cypress no Chrome
        uses: cypress-io/github-action@v6
        with:
          browser: chrome